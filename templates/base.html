<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Equipment Patrol Timetable{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <div class="brand">🛠️ Patrol Board</div>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if nav=='dash' else '' }}">Dashboard</a>
    <a href="{{ url_for('timecard') }}" class="{{ 'on' if nav=='time' else '' }}">Timecard</a>
    <a href="{{ url_for('settings') }}" class="{{ 'on' if nav=='settings' else '' }}">Settings</a>
  </nav>
</div>
<div class="wrap">
{% with msgs = get_flashed_messages() %}
{% if msgs %}<div class="flash ok">{{ msgs[0] }}</div>{% endif %}
{% endwith %}
{% block body %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
